<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>CP Planner</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="app-container">
			<!-- ZONE 1: Toolbar -->
			<header class="toolbar">
				<div class="toolbar-left">
					<svg
						class="brand-icon"
						width="16"
						height="16"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6" />
					</svg>
					<span class="brand-title">CP Planner</span>
					<select
						id="serverSelect"
						class="server-select"
						aria-label="Travian server"
					></select>
				</div>
				<div class="toolbar-right">
					<span class="speed-badge">x<span id="speed-display">1</span></span>
					<button
						id="refreshIndicator"
						class="icon-btn"
						title="Fetching latest data..."
					>
						<svg
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2.5"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
							<path d="M21 3v5h-5" />
						</svg>
					</button>
					<button
						id="exportLog"
						class="icon-btn"
						title="Export forecast log"
						aria-label="Export forecast log"
					>
						<svg
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2.5"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
							<path d="M7 10l5 5 5-5" />
							<path d="M12 15V3" />
						</svg>
					</button>
					<button
						id="alarmToggle"
						class="icon-btn"
						title="Toggle Alarm"
					></button>
				</div>
			</header>

			<!-- ZONE 2: Countdown Hero -->
			<section class="hero-section">
				<div class="hero-glow"></div>
				<span id="forecastLabel" class="micro-label forecast-label"
					>CP forecast</span
				>
				<span id="timeRemaining" class="countdown-value">---</span>
				<div
					class="copy-pill"
					id="dateRow"
					role="button"
					tabindex="0"
					aria-label="Copy remaining time"
					title="Click to copy duration"
				>
					<svg
						width="12"
						height="12"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
						<line x1="16" y1="2" x2="16" y2="6"></line>
						<line x1="8" y1="2" x2="8" y2="6"></line>
						<line x1="3" y1="10" x2="21" y2="10"></line>
					</svg>
					<span id="targetDate">---</span>
				</div>
				<p id="forecastDetails" class="forecast-details"></p>
				<div class="progress-track">
					<div class="progress-fill" id="progressFill"></div>
				</div>
				<div class="cp-row">
					<div class="cp-current">
						<span class="micro-label">Current CP</span>
						<span id="cpDisplay" class="cp-value">---</span>
					</div>
					<div class="cp-target">
						<span class="micro-label">Target</span>
						<select
							id="targetSlot"
							class="target-select"
							aria-label="Settlement target"
						></select>
					</div>
				</div>
			</section>

			<!-- ZONE 3: Production Strip -->
			<section class="production-strip">
				<div class="prod-main">
					<span class="micro-label">Total Production</span>
					<span class="prod-value"
						><span id="totalProdDisplay">0</span>
						<span class="prod-unit">CP/d</span></span
					>
				</div>
			</section>

			<p id="statusNote" class="status-note" role="status"></p>

			<!-- ZONE 4: Village List -->
			<section class="villages-section">
				<div class="villages-card">
					<div class="villages-header">
						<span class="col-name">Village</span>
						<span class="col-th">TH</span>
						<span class="col-cel">Small</span>
						<span class="col-cel">Large</span>
					</div>
					<div id="villageList" class="village-list">
						<div class="empty-state">
							<svg
								width="24"
								height="24"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="1.5"
							>
								<path
									d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
								></path>
							</svg>
							<p>
								Go to <b>Village Overview &rarr; Culture Points</b> to load
								data.
							</p>
						</div>
					</div>
				</div>
			</section>
		</div>

		<script src="shared.js"></script>
		<script src="data.js"></script>
		<script src="popup.js"></script>
	</body>
</html>
