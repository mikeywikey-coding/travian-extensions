<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			:root {
				color-scheme: dark;
			}

			body {
				width: 224px;
				padding: 15px;
				font-family: "Verdana", sans-serif;
				text-align: center;
				background-color: #1a1a1a; /* Dark Background */
				color: #e0e0e0; /* Light Text */
			}

			h3 {
				margin-top: 0;
				margin-bottom: 14px;
				font-size: 16px;
				color: #ffffff;
				text-transform: uppercase;
				letter-spacing: 1px;
			}

			/* --- Toggle Switch Styling --- */
			.switch {
				position: relative;
				display: inline-block;
				width: 60px;
				height: 34px;
			}

			.switch input {
				opacity: 0;
				width: 0;
				height: 0;
			}

			.slider {
				position: absolute;
				cursor: pointer;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				background-color: #444; /* Dark gray for "OFF" state */
				transition: 0.4s;
				border-radius: 34px;
			}

			.slider:before {
				position: absolute;
				content: "";
				height: 26px;
				width: 26px;
				left: 4px;
				bottom: 4px;
				background-color: #e0e0e0; /* Light knob */
				transition: 0.4s;
				border-radius: 50%;
			}

			/* "ON" State - Travian Green */
			input:checked + .slider {
				background-color: #71d000;
			}

			input:focus + .slider {
				box-shadow: 0 0 1px #71d000;
			}

			input:checked + .slider:before {
				transform: translateX(26px);
				background-color: #fff;
			}

			/* --- Custom dark color picker --- */
			.picker {
				margin-top: 18px;
				padding-top: 14px;
				border-top: 1px solid #333;
			}

			/* Saturation (x) × Value (y) square */
			.sv-area {
				position: relative;
				width: 100%;
				height: 120px;
				border-radius: 6px;
				border: 1px solid #333;
				cursor: crosshair;
				overflow: hidden;
				touch-action: none;
			}
			.sv-white,
			.sv-black {
				position: absolute;
				inset: 0;
			}
			.sv-white {
				background: linear-gradient(to right, #fff, rgba(255, 255, 255, 0));
			}
			.sv-black {
				background: linear-gradient(to top, #000, rgba(0, 0, 0, 0));
			}
			.sv-thumb {
				position: absolute;
				width: 12px;
				height: 12px;
				border-radius: 50%;
				border: 2px solid #fff;
				box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
				transform: translate(-50%, -50%);
				pointer-events: none;
			}

			/* Hue strip */
			.hue-area {
				position: relative;
				width: 100%;
				height: 14px;
				margin-top: 12px;
				border-radius: 7px;
				border: 1px solid #333;
				cursor: pointer;
				touch-action: none;
				background: linear-gradient(
					to right,
					#f00 0%,
					#ff0 17%,
					#0f0 33%,
					#0ff 50%,
					#00f 67%,
					#f0f 83%,
					#f00 100%
				);
			}
			.hue-thumb {
				position: absolute;
				top: 50%;
				width: 6px;
				height: 18px;
				border-radius: 3px;
				border: 2px solid #fff;
				box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
				background: transparent;
				transform: translate(-50%, -50%);
				pointer-events: none;
			}

			/* Preview + hex readout */
			.readout {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-top: 12px;
			}
			.preview {
				flex: 0 0 auto;
				width: 24px;
				height: 24px;
				border-radius: 50%;
				border: 1px solid #555;
			}
			.hex-input {
				flex: 1 1 auto;
				min-width: 0;
				box-sizing: border-box;
				background-color: #2a2a2a;
				color: #e0e0e0;
				border: 1px solid #444;
				border-radius: 4px;
				padding: 5px 6px;
				font-family: "Consolas", monospace;
				font-size: 12px;
				text-align: center;
				text-transform: uppercase;
			}
			.hex-input:focus {
				outline: none;
				border-color: #71d000;
			}

			/* --- Favorites --- */
			.favorites {
				margin-top: 16px;
				padding-top: 12px;
				border-top: 1px solid #333;
			}
			.fav-label {
				font-size: 10px;
				color: #888;
				text-align: left;
				margin-bottom: 8px;
				text-transform: uppercase;
				letter-spacing: 1px;
			}
			.fav-row {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}
			.fav-swatch {
				position: relative;
				width: 24px;
				height: 24px;
				padding: 0;
				border-radius: 5px;
				border: 1px solid #444;
				cursor: pointer;
			}
			.fav-swatch:hover {
				border-color: #888;
			}
			.fav-remove {
				position: absolute;
				top: -5px;
				right: -5px;
				width: 14px;
				height: 14px;
				padding: 0;
				border-radius: 50%;
				border: 1px solid #555;
				background: #000;
				color: #fff;
				font-size: 10px;
				line-height: 1;
				cursor: pointer;
				display: none;
				align-items: center;
				justify-content: center;
			}
			.fav-swatch:hover .fav-remove {
				display: flex;
			}
			.fav-add {
				width: 24px;
				height: 24px;
				padding: 0;
				border-radius: 5px;
				border: 1px dashed #555;
				background: none;
				color: #888;
				font-size: 16px;
				line-height: 1;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.fav-add:hover {
				border-color: #888;
				color: #ccc;
			}

			.reset {
				display: block;
				margin: 14px auto 0;
				background: none;
				border: none;
				color: #888;
				font-size: 10px;
				text-decoration: underline;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<h3>Night Mode</h3>
		<label class="switch">
			<input type="checkbox" id="toggleNight" />
			<span class="slider"></span>
		</label>

		<div class="picker">
			<div id="svArea" class="sv-area">
				<div class="sv-white"></div>
				<div class="sv-black"></div>
				<div id="svThumb" class="sv-thumb"></div>
			</div>

			<div id="hueArea" class="hue-area">
				<div id="hueThumb" class="hue-thumb"></div>
			</div>

			<div class="readout">
				<span id="preview" class="preview"></span>
				<input
					id="hexInput"
					class="hex-input"
					type="text"
					maxlength="7"
					spellcheck="false"
					aria-label="Hex color"
				/>
			</div>
		</div>

		<div class="favorites">
			<div class="fav-label">Favorites</div>
			<div id="favRow" class="fav-row"></div>
		</div>

		<button type="button" id="resetColor" class="reset">Reset to default</button>

		<script src="popup.js"></script>
	</body>
</html>
